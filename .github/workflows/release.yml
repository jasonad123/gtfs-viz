name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release from tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const prereleasePattern = /^v\d+\.\d+\.\d+-(?:rc|beta|alpha)\.\d+$/;
            const stablePattern = /^v\d+\.\d+\.\d+$/;
            const isPrerelease = prereleasePattern.test(tag);

            if (!isPrerelease && !stablePattern.test(tag)) {
              core.info(`Skipping unsupported tag format: ${tag}`);
              return;
            }

            let body = "";
            let generateNotes = true;
            let matchedPrerelease = null;

            if (!isPrerelease) {
              const version = tag.replace(/^v/, "");
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              });

              const prereleases = releases
                .filter((release) => release.prerelease)
                .filter((release) =>
                  new RegExp(`^v${version}-rc\\.[0-9]+$`).test(release.tag_name),
                )
                .sort((a, b) => {
                  const aTime = Date.parse(a.published_at || a.created_at || "");
                  const bTime = Date.parse(b.published_at || b.created_at || "");
                  return bTime - aTime;
                });

              if (prereleases.length > 0) {
                matchedPrerelease = prereleases[0];
                body = matchedPrerelease.body || "";
                generateNotes = false;
              }
            }

            let releaseExists = false;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.info(`Release ${tag} already exists (${existing.data.html_url})`);
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (!releaseExists) {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                prerelease: isPrerelease,
                make_latest: isPrerelease ? "false" : "true",
                body: body || undefined,
                generate_release_notes: generateNotes,
              });
            }

            if (!isPrerelease && matchedPrerelease) {
              core.info(`Cleaning up prerelease ${matchedPrerelease.tag_name}`);

              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: matchedPrerelease.id,
              });

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${matchedPrerelease.tag_name}`,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
